; PlatformIO build configuration for the Cybrid Teensy sketches.
;
; Each sketch stays a plain Arduino sketch (folder name == .ino name), so it still opens in the
; Arduino IDE. Every environment below builds one sketch; `custom_sketch_dir` is picked up by
; scripts/select_sketch.py.
;
;   pio run                      build everything
;   pio run -e v1_3              build one environment
;   pio run -e v1_3 -t upload    build and flash (Teensy Loader opens automatically)
;   pio device monitor           serial output of the calibration sketches

[platformio]
default_envs = v1_3, v1_2, calibrate_1, calibrate_2, calibrate_3

[env]
platform = teensy
framework = arduino
board = teensy41
extra_scripts = pre:scripts/select_sketch.py

; --- Main firmware (USB type: MIDI) ----------------------------------

; Current firmware: fixed V1.3, host-verified against V1.2, not yet play-tested.
[env:v1_3]
custom_sketch_dir = src/teensy/main/My_Hybrid_Piano_V1.3
build_flags = -D USB_MIDI

; Last firmware tested on the instrument.
[env:v1_2]
custom_sketch_dir = src/teensy/main/My_Hybrid_Piano_V1.2
build_flags = -D USB_MIDI

; V1.3 for the original Teensy 3.6 build (not in default_envs).
[env:v1_3_teensy36]
board = teensy36
custom_sketch_dir = src/teensy/main/My_Hybrid_Piano_V1.3
build_flags = -D USB_MIDI

; --- Calibration utilities (USB type: Serial, the default) -----------

[env:calibrate_1]
custom_sketch_dir = src/teensy/utils/Calibrate_Sensor_1

[env:calibrate_2]
custom_sketch_dir = src/teensy/utils/Calibrate_Sensor_2

[env:calibrate_3]
custom_sketch_dir = src/teensy/utils/Calibrate_Sensor_3
